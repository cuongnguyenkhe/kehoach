<style>
  :root{
    --bg:#3a6ff7; --card:#ffffff; --text:#1f2937; --muted:#9aa3b5; --line:#e5e8f0;
    --thang:#f25a6b; --ngay:#fdac2f; --dem:#3a6ff7; --accent:#3a6ff7; --accent-ink:#ffffff;
    --head:#000000; --head2:#000000; --shadow:0 4px 14px rgba(40,60,120,.08);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:auto}
  body{margin:0;padding:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#3569fb 0%,#4f7dfb 55%,#6f93fb 100%);background-color:#4f7dfb;color:var(--text);font-size:14px;line-height:1.45}

  /* ===== Header ===== */
  header{background:transparent;color:#fff;padding:22px 24px;max-width:none;margin:0;border:0;border-radius:0}
  .headwrap{max-width:1300px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
  .headwrap .unit{font-family:"Times New Roman",Times,serif;margin:0 0 4px;font-size:24px;line-height:1.35;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#fff}
  header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.2px;color:var(--text)}
  header p{margin:4px 0 0;opacity:1;font-size:16px;font-weight:700;color:var(--text)}
  @media(max-width:700px){ header h1{font-size:22px} .headwrap .unit{font-size:18px} }

  #subtitle{background:#fff;padding:14px 24px;border-bottom:1px solid var(--line);border-radius:8px}
  #subtitle:empty{display:none}
  #subtitle,#kqSubtitle{color:#dc2626;font-weight:700;font-size:16px;font-family:Arial,Helvetica,sans-serif}

  /* ===== Control bar (sticky) ===== */
  .controlbar{position:static;background:#fff;width:100%;border-bottom:1px solid var(--line);border-radius:8px}
  .controlbar-inner{max-width:none;margin:0;padding:12px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .field.grow{flex:1;min-width:260px}
  input,select,button{font-family:Arial,Helvetica,sans-serif;font-size:inherit;font-weight:inherit;line-height:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  input[readonly]{background:#f1f3f8;color:#6b7280;cursor:not-allowed}
  input[type="date"]{color-scheme:light}
  input[type="date"]::-webkit-calendar-picker-indicator{
    cursor:pointer;opacity:1;filter:none;width:16px;height:16px;padding:0;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233a6ff7' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='5' width='18' height='16' rx='2'/><path d='M3 10h18M8 3v4M16 3v4'/></svg>") center/16px 16px no-repeat;
  }
  button{cursor:pointer;font-weight:600;transition:filter .15s}
  button:hover{filter:brightness(0.97)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.ghost{background:transparent}
  #status{font-size:12.5px;font-weight:400;text-transform:none;letter-spacing:normal;color:var(--muted)}
  #status.err{color:#dc2626;white-space:pre-line}

  main{max-width:none;width:100%;margin:0;padding:18px 24px 40px;display:flex;flex-direction:column;gap:26px;background:#f5f6fa;border-radius:0;min-height:calc(100vh - 90px)}

  /* ===== Section shell ===== */
  section.block{display:flex;flex-direction:column;gap:12px}
  .block-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .block-head h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .block-head .desc{color:var(--muted);font-size:12.5px;margin-left:2px}
  .block-head .spacer{flex:1}
  a.openlink{color:var(--accent);text-decoration:none;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
  a.openlink:hover{text-decoration:underline}

  /* ===== Result title / today badge ===== */
  .resultTitle{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .resultTitle .today{background:#ef4444;color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.3px}

  /* ===== Summary cards ===== */
  .summary{display:flex;flex-direction:column;gap:14px}
  .sbox{background:#ffffff;color:#1f2937;border:1px solid #eef0f6;border-radius:14px;border-top-width:4px;padding:16px;box-shadow:var(--shadow)}
  .sbox.thang{border-top-color:var(--thang)} .sbox.ngay{border-top-color:var(--ngay)} .sbox.dem{border-top-color:var(--dem)}
  .sbox h3{margin:0 0 10px;font-size:14.5px;font-weight:700;display:flex;justify-content:flex-start;align-items:center;gap:8px;color:#000000}
  .sbox.thang h3{color:var(--thang)} .sbox.ngay h3{color:var(--ngay)} .sbox.dem h3{color:var(--dem)}
  .sbox .cnt{font-size:inherit;font-weight:700;color:#dc2626}
  .team-line{margin:8px 0;line-height:1.6}
  .team-line b{color:#16a34a;font-size:inherit;font-weight:700;display:block;margin-bottom:3px}
  .team-line b .tba-cnt{color:#dc2626}
  .tag{display:inline-block;background:#eef3ff;color:#1f2937;border:1px solid #d6e0ff;border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12.5px;font-weight:700}
  .empty{color:var(--muted);font-style:italic;font-size:13px}

  /* ===== Vùng 2: Kết quả công tác (xếp theo hàng dọc) ===== */
  .kqlist{display:flex;flex-direction:column;gap:14px}
  .kqbox{background:#fff;border:1px solid #eef0f6;border-top:4px solid var(--c,#3a6ff7);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .kqbox.c1{--c:#3a6ff7} .kqbox.c2{--c:#7c3aed} .kqbox.c3{--c:#16a34a} .kqbox.c4{--c:#f25a6b}
  .kqbox > h3{margin:0 0 10px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--c)}
  .kqbox > h3 .cnt{color:#dc2626}
  .kqbox.c3{border-top-color:#166534}
  .kqbox.c3 > h3{color:#166534}
  .kq-team{margin:12px 0 0}
  .kq-team > b{display:block;color:#16a34a;font-weight:700;margin-bottom:6px}
  .kq-team > b .tba-cnt{color:#dc2626}
  .kq-item{border:1px solid var(--line);border-left:3px solid var(--c,#3a6ff7);border-radius:8px;padding:8px 10px;margin:6px 0;background:#fafbff}
  .kq-item .kq-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
  .kq-item .kq-time{font-size:12.5px;color:#374151;font-weight:700}
  .kq-item .kq-unit{font-size:12.5px;color:#374151}
  .kq-item .kq-unit em{font-style:normal;font-weight:700}
  .kq-item .kq-content{white-space:pre-line;font-size:13px;line-height:1.5}
  .kq-item .kq-meta{margin-top:5px;font-size:12.5px;color:#4b5563}
  .kq-item .kq-meta span{display:inline-block;margin-right:12px}
  .kq-item .kq-meta em{font-style:normal;font-weight:700;color:#374151}

  @media(max-width:700px){
    body{padding:0}
    header{padding:16px}
    .controlbar-inner{padding:10px 16px}
    main{padding:14px 16px 30px}
  }

  /* ===== Thanh nút nổi: toàn màn hình + cuộn lên ===== */
  .fabbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:96vw}
  .fabbar button{display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:#fff;color:#1f2937;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;font-family:Arial,Helvetica,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.22);line-height:1.2}
  .fabbar button:hover{background:#eef2ff;color:var(--accent)}
  body{padding-bottom:56px}
  @media print{.fabbar{display:none}}

</style>
</head>
<body>

<header>
  <div class="headwrap">
    <div class="unit">Đội giám sát<br>Trung tâm giám sát</div>
  </div>

<main>
  <section class="block">
    <div class="resultTitle" id="subtitle" style="justify-content:center;text-align:center"></div>
<div class="controlbar">
  <div class="controlbar-inner">
    <div class="field grow">
      <span>Dữ liệu từ Link Google Sheet: <a class="openlink" id="openLink" href="#" target="_blank" rel="noopener" style="text-transform:none;letter-spacing:normal;margin-left:6px">Mở trong tab mới ↗</a></span>
      <input type="url" id="urlInput" readonly tabindex="-1" placeholder="https://docs.google.com/spreadsheets/d/…/edit?gid=…">
    </div>
    <div class="field" style="max-width:170px">
      CHỌN NGÀY
      <input type="date" id="dateInput">
    </div>

  </div>
</div>
    <div class="block-head">

  <!-- ===== Vùng 2: kết quả công tác ===== -->
  <section class="block">
    <div class="resultTitle" id="kqSubtitle" style="justify-content:center;text-align:center;background:#fff;padding:14px 24px;border-radius:8px"></div>
    <div class="block-head">
      <span class="desc" id="kqStatus">Đang tải…</span>
    </div>
    <div class="kqlist" id="kqList"></div>
  </section>
</main>

<div class="fabbar" id="fabbar">
  <button type="button" id="btnAutoScroll">▶ <span id="btnAutoScrollText">Tự động chạy</span></button>
</div>
</div><!-- /#page -->

<script>
const $ = id => document.getElementById(id);
const DEFAULT_URL = "https://docs.google.com/spreadsheets/d/1l1X8PcWLT0mXODl8CagJtGFLemQkuQq_/edit?gid=1786392608#gid=1786392608";
const KEY = { thang:"thang", ngay:"ngay", dem:"dem" };
const LABEL = { thang:"Kiểm tra THÁNG", ngay:"Kiểm tra NGÀY", dem:"Kiểm tra ĐÊM" };
const WD = ["CN","T2","T3","T4","T5","T6","T7"];

let DATA = { tba: [], month: 11, year: 2026 };
let DAYS = 31, FIRST_DAY_COL = 3;

const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").trim().toLowerCase();
const pad = n => String(n).padStart(2,"0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtVN = d => `${WD[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function setStatus(t, err){ const s=$("status"); s.textContent=t||""; s.className = err?"err":""; }

function parseSheetUrl(u){
  const m = String(u).match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  if(!m) return null;
  const g = String(u).match(/[#?&]gid=(\d+)/);
  return { id:m[1], gid:g?g[1]:null };
}

function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=""; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* Tự nhận diện vị trí cột Đội / TBA / Tháng-Ngày-Đêm / các cột ngày */
function buildData(rows){
  const now=new Date(); let month=now.getMonth()+1, year=now.getFullYear();
  for(let i=0;i<Math.min(rows.length,12);i++){
    for(const c of rows[i]){
      const m = String(c??"").match(/(\d{1,2})\s*n[aă]m\s*(\d{4})/i);
      if(m){ month=+m[1]; year=+m[2]; }
    }
  }
  const cnt={};
  rows.forEach(r=>r.forEach((c,i)=>{ if(norm(c) in KEY) cnt[i]=(cnt[i]||0)+1; }));
  let labCol=-1, best=0;
  for(const k in cnt) if(cnt[k]>best){ best=cnt[k]; labCol=+k; }
  if(labCol<0) return { tba:[], month, year };
  const bCol=labCol-1, aCol=labCol-2;
  let firstCol=labCol+1, n=31;
  for(const r of rows.slice(0,40)){
    const cols=[]; r.forEach((c,i)=>{ if(i>labCol && /^\d{1,2}$/.test(String(c??"").trim())) cols.push(i); });
    if(cols.length>=25){ firstCol=cols[0]; n=Math.min(cols.length,31); break; }
  }
  DAYS=n; FIRST_DAY_COL=firstCol;
  const tba=[]; let team="", cur=null;
  for(const r of rows){
    const lab = norm(r[labCol]);
    if(!(lab in KEY)) continue;
    const a = aCol>=0 ? String(r[aCol]??"").trim() : "";
    const b = bCol>=0 ? String(r[bCol]??"").trim() : "";
    if(a && /\d/.test(a)) team = a;
    if(b){
      cur = { team, name:b, thang:Array(DAYS).fill(false), ngay:Array(DAYS).fill(false), dem:Array(DAYS).fill(false) };
      tba.push(cur);
    }
    if(!cur) continue;
    for(let i=0;i<DAYS;i++){
      cur[KEY[lab]][i] = String(r[FIRST_DAY_COL+i]??"").trim() !== "";
    }
  }
  return { tba, month, year };
}

async function tryFetchCSV(url){
  const res = await fetch(url, { cache:"no-store" });
  if(!res.ok) throw new Error("HTTP "+res.status);
  const t = await res.text();
  if(/^\s*<(!doctype|html)/i.test(t)) throw new Error("Google trả về trang đăng nhập (sheet chưa chia sẻ công khai?)");
  return parseCSV(t);
}

function jsonpLoad(url, fmt){
  return new Promise((resolve,reject)=>{
    const cb="__gv"+Date.now()+Math.floor(Math.random()*1e4);
    const s=document.createElement("script");
    const cleanup=()=>{ clearTimeout(t); delete window[cb]; s.remove(); };
    const t=setTimeout(()=>{ cleanup(); reject(new Error("quá thời gian chờ")); },20000);
    window[cb]=obj=>{
      cleanup();
      if(!obj || obj.status==="error"){
        const e=obj&&obj.errors&&obj.errors[0];
        reject(new Error((e&&(e.detailed_message||e.message))||"Google báo lỗi")); return;
      }
      resolve(obj.table.rows.map(r=>(r.c||[]).map(c=> c ? (fmt ? (c.f ?? (c.v!=null ? String(c.v) : "")) : (c.v!=null ? String(c.v) : (c.f??""))) : "")));
    };
    s.onload=()=>{ if(window[cb]){ cleanup(); reject(new Error("Google trả về trang đăng nhập (sheet chưa chia sẻ công khai?)")); } };
    s.onerror=()=>{ cleanup(); reject(new Error("không kết nối được tới Google (mạng bị chặn?)")); };
    s.src=url+"&tqx=out:json;responseHandler:"+cb;
    document.head.appendChild(s);
  });
}

async function loadFromGoogle(){
  const p = parseSheetUrl(DEFAULT_URL);
  if(!p){ setStatus("Link không hợp lệ. Hãy dán link Google Sheet dạng https://docs.google.com/spreadsheets/d/…", true); return; }

  /* Link mở bảng gốc đúng tab theo gid */
  const editUrl = `https://docs.google.com/spreadsheets/d/${p.id}/edit${p.gid?("?gid="+p.gid):""}`;
  $("openLink").href = editUrl;

  setStatus("Đang tải từ Google Sheet…");
  const g = p.gid ? `&gid=${p.gid}` : "";
  const base = `https://docs.google.com/spreadsheets/d/${p.id}`;
  const strategies = [
    ["gviz JSONP",  () => jsonpLoad(`${base}/gviz/tq?headers=0${g}`)],
    ["gviz CSV",    () => tryFetchCSV(`${base}/gviz/tq?tqx=out:csv&headers=0${g}`)],
    ["export CSV",  () => tryFetchCSV(`${base}/export?format=csv${g}`)]
  ];
  const errs=[];
  for(const [name,fn] of strategies){
    try{
      const rows = await fn();
      const d = buildData(rows);
      if(d.tba.length){ DATA = d; setStatus(`Cập nhật mới nhất lúc: ${new Date().toLocaleTimeString("vi-VN")} ngày ${new Date().toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"})}`); render(); return; }
      errs.push(`${name}: đọc được ${rows.length} dòng nhưng không thấy dòng Tháng/Ngày/Đêm`);
    }catch(e){ errs.push(`${name}: ${e.message}`); }
  }
  setStatus("Không đọc được Google Sheet. Chi tiết:\n"+errs.join("\n")+"\n\nHãy kiểm tra: (1) sheet đã chia sẻ \"Bất kỳ ai có đường liên kết – Người xem\"; (2) mở file HTML này bằng Chrome/Edge trực tiếp (không xem trước trong ứng dụng).", true);
}

function selectedDate(){
  const v = $("dateInput").value; if(!v) return null;
  const [y,m,d] = v.split("-").map(Number);
  return new Date(y,m-1,d);
}
function selectedIndex(){
  const sel = selectedDate(); if(!sel) return -1;
  const first = new Date(DATA.year, DATA.month-1, 1);
  const idx = Math.round((sel-first)/864e5);
  return (idx>=0 && idx<DAYS) ? idx : -1;
}

function render(){
  const idx = selectedIndex();
  const d = selectedDate();
  const isToday = d && toISO(d)===toISO(new Date());
  $("subtitle").innerHTML = `KẾ HOẠCH KIỂM TRA TBA 110/220KV THÁNG ${DATA.month}/${DATA.year}`;

  const fmtNgay = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  $("resultTitle").innerHTML = d
    ? `🔎 Kế hoạch kiểm tra TBA 110/220kV ngày ${fmtNgay(d)} ${isToday?'<span class="today">HÔM NAY</span>':''}`
    : "🔎 Chọn một ngày để lọc";

  const sum = { thang:{}, ngay:{}, dem:{} };
  if(idx>=0){
    for(const t of DATA.tba){
      for(const k of ["thang","ngay","dem"]){
        if(t[k][idx]) (sum[k][t.team] ??= []).push(t.name);
      }
    }
  }
  const count = k => Object.values(sum[k]).reduce((a,b)=>a+b.length,0);

  const sm = $("summary"); sm.innerHTML="";
  for(const k of ["thang","ngay","dem"]){
    const box=document.createElement("div"); box.className="sbox "+k;
    let body="";
    if(idx<0){
      body = `<div class="empty">Ngày đã chọn nằm ngoài phạm vi kế hoạch trong sheet, hoặc chưa chọn ngày.</div>`;
    } else {
      const teams=Object.keys(sum[k]).sort((a,b)=>a.localeCompare(b,"vi",{numeric:true}));
      body = teams.length
        ? teams.map(tm=>`<div class="team-line"><b>Đội ${tm}: <span class="tba-cnt">${sum[k][tm].length} TBA</span></b>${sum[k][tm].map(n=>`<span class="tag">${esc(n)}</span>`).join("")}</div>`).join("")
        : `<div class="empty">Không có TBA nào.</div>`;
    }
    box.innerHTML = `<h3>${LABEL[k]}:<span class="cnt">${idx<0?"–":count(k)} TBA</span></h3>${body}`;
    sm.appendChild(box);
  }
}

$("urlInput").value = DEFAULT_URL;
$("dateInput").value = toISO(new Date());
$("dateInput").onchange = render;
$("loadBtn").onclick = loadFromGoogle;

loadFromGoogle();

/* ================= VÙNG 2: KẾT QUẢ CÔNG TÁC (sheet KHSX) ================= */
const KQ_DEFAULT_URL = "https://docs.google.com/spreadsheets/d/1a7Nzd5QxLmxMDtqEhTDbhu3uq7s6l9gT-NNiM7XwDgY/edit?gid=1602564886#gid=1602564886";
const KQ_GROUPS = [
  { key:"tba_ngay", cls:"c1", title:"Công tác trong ngày TBA" },
  { key:"tba_dai",  cls:"c2", title:"Công tác dài ngày TBA" },
  { key:"dz_ngay",  cls:"c3", title:"Công tác trong ngày đường dây" },
  { key:"dz_dai",   cls:"c4", title:"Công tác dài ngày đường dây" }
];
let KQ = { title:"", groups:{} };

function setKqStatus(t, err){ const s=$("kqStatus"); s.textContent=t||""; s.className = "desc" + (err?" err":""); if(err){ s.style.color="#dc2626"; s.style.whiteSpace="pre-line"; } else { s.style.color=""; s.style.whiteSpace=""; } }

function parseKQ(rows){
  const out = { title:"", groups:{} };
  KQ_GROUPS.forEach(g=>out.groups[g.key]=[]);

  /* Nhận diện cột theo dòng tiêu đề bảng */
  const col = {};
  for(let i=0;i<Math.min(rows.length,25);i++){
    const r = rows[i].map(norm);
    if(r.some(c=>c.startsWith("dia diem"))){
      r.forEach((c,j)=>{
        if(c==="ngay" && col.ngay==null) col.ngay=j;
        else if(c.startsWith("dia diem")) col.dd=j;
        else if(c.startsWith("noi dung")) col.nd=j;
        else if(c.startsWith("nguoi thuc hien")) col.nth=j;
        else if(c.startsWith("don vi")) col.dv=j;
        else if(c.startsWith("ghi chu")) col.gc=j;
      });
      for(let k=i;k<=i+2 && k<rows.length;k++){
        rows[k].map(norm).forEach((c,j)=>{
          if(c==="ke hoach") col.kh=j;
          else if(c==="bat dau") col.bd=j;
          else if(c==="ket thuc") col.kt=j;
        });
      }
      break;
    }
  }
  const have = col.dd!=null && col.nd!=null;
  const get = (r,j)=> (j!=null ? String(r[j]??"").trim() : "");

  let team="", section="", cat="";
  for(const r of rows){
    const cells = r.map(c=>String(c??"").trim());
    const nonEmpty = cells.filter(Boolean);
    if(!nonEmpty.length) continue;
    const text = norm(nonEmpty.join(" ")).replace(/\s+/g," ");
    if(!out.title && /(ket qua|ke hoach) van hanh luoi dien/.test(text)) out.title = nonEmpty.join(" ");

    let m;
    if((m = text.match(/^([ivx]+)\s+(doi\b.*)$/))){
      team = nonEmpty.join(" ").replace(/^[IVXivx]+\s+/,"").replace(/\s*:?\s*\(.*$/,"").trim();
      section=""; cat=""; continue;
    }
    if(/^[a-d]\s+phan\s+tram/.test(text)){ section="tba"; cat=""; continue; }
    if(/^[a-d]\s+phan\s+duong\s+day/.test(text)){ section="dz"; cat=""; continue; }
    if(/^\d+\s+cong tac\b/.test(text)){
      cat = /cong tac trong ngay/.test(text) ? "ngay" : /cong tac dai ngay/.test(text) ? "dai" : "";
      continue;
    }
    /* dòng công tác: ô đầu tiên có dạng 1.1, 2.10 ... */
    if(/^\d+\.\d+$/.test(nonEmpty[0]) && section && cat){
      let it;
      if(have){
        it = { date:get(r,col.ngay), loc:get(r,col.dd), content:get(r,col.nd), who:get(r,col.nth), unit:get(r,col.dv),
               plan:get(r,col.kh), start:get(r,col.bd), end:get(r,col.kt), note:get(r,col.gc) };
      } else {
        const v = nonEmpty.slice(1);
        it = { date:v[0]||"", loc:v[1]||"", content:v[2]||"", who:"", unit:"", plan:"", start:"", end:"", note:v.slice(3).join(" ") };
      }
      it.team = team || "(Chưa rõ đội)";
      out.groups[section+"_"+cat].push(it);
    }
  }
  return out;
}

/* Nối các dòng bị ngắt cứng trong ô Google Sheet; chỉ xuống dòng ở gạch đầu dòng / dòng ngăn cách */
function tidy(s){
  const out=[];
  String(s||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const isSep = /^[-–—_=\s]{3,}$/.test(l);
    const isBullet = /^['‘’]?\s*[-–•+*]\s*\S/.test(l) && !isSep;
    if(!out.length || isSep || isBullet || /^[-–—_=\s]{3,}$/.test(out[out.length-1])) out.push(l);
    else out[out.length-1] += " " + l;
  });
  return out.join("\n");
}
const flat = s => String(s||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).join(", ");

const fixKQTitle = t => String(t||"").normalize("NFC").replace(/K[ẾE]T\s*QU[ẢA]/i,"KẾ HOẠCH");
function renderKQ(){
  $("kqSubtitle").textContent = fixKQTitle(KQ.title) || "KẾ HOẠCH VẬN HÀNH LƯỚI ĐIỆN";
  /* Ngày lấy từ tiêu đề sheet (hoặc ngày của công tác đầu tiên) */
  let kqDate = (KQ.title.match(/\d{1,2}\s*\/\s*\d{1,2}(?:\s*\/\s*\d{4})?/)||[])[0] || "";
  if(!kqDate){
    for(const g of KQ_GROUPS){ const it=(KQ.groups[g.key]||[])[0]; if(it && /\d{1,2}\s*\/\s*\d{1,2}/.test(it.date)){ kqDate=it.date.trim(); break; } }
  }
  kqDate = kqDate.replace(/\s+/g,"");
  if(kqDate && !/\/\d{4}$/.test(kqDate)) kqDate += "/" + (DATA.year || new Date().getFullYear());
  /* Tiêu đề sheet: hiện đủ ngày/tháng/năm */
  if(kqDate){
    const base = fixKQTitle(KQ.title) || "KẾ HOẠCH VẬN HÀNH LƯỚI ĐIỆN NGÀY";
    $("kqSubtitle").textContent = /\d{1,2}\s*\/\s*\d{1,2}(?:\s*\/\s*\d{4})?/.test(base)
      ? base.replace(/\d{1,2}\s*\/\s*\d{1,2}(?:\s*\/\s*\d{4})?/, kqDate)
      : base.replace(/\s*$/," ") + kqDate;
  }
  const wrap = $("kqList"); wrap.innerHTML="";
  for(const g of KQ_GROUPS){
    const items = KQ.groups[g.key] || [];
    const byTeam = {};
    items.forEach(it=>(byTeam[it.team] ??= []).push(it));
    const teams = Object.keys(byTeam).sort((a,b)=>a.localeCompare(b,"vi",{numeric:true}));
    const body = teams.length ? teams.map(tm=>{
      const list = byTeam[tm].map(it=>{
        const time = it.plan ? it.plan.replace(/\s*\n\s*/g," ") : "";
        return `<div class="kq-item">
          <div class="kq-top">${it.loc?`<span class="tag">${esc(it.loc.replace(/\s*\n\s*/g," "))}</span>`:""}${time?`<span class="kq-time">⏱ ${esc(time)}</span>`:""}${it.unit?`<span class="kq-unit">👥 <em>Đơn vị công tác:</em> ${esc(flat(it.unit))}</span>`:""}</div>
          <div class="kq-content">${esc(tidy(it.content))}</div>
        </div>`;
      }).join("");
      return `<div class="kq-team"><b>${esc(tm)}: <span class="tba-cnt">${byTeam[tm].length} công tác</span></b>${list}</div>`;
    }).join("") : `<div class="empty">Không có công tác nào.</div>`;
    const box = document.createElement("div");
    box.className = "kqbox "+g.cls;
    box.innerHTML = `<h3>${g.title}:<span class="cnt">${items.length} công tác</span></h3>${body}`;
    wrap.appendChild(box);
  }
}

async function loadKQ(){
  const p = parseSheetUrl(KQ_DEFAULT_URL);
  if(!p){ setKqStatus("Link không hợp lệ. Hãy dán link Google Sheet dạng https://docs.google.com/spreadsheets/d/…", true); return; }
  setKqStatus("Đang tải từ Google Sheet…");
  const g = p.gid ? `&gid=${p.gid}` : "";
  const base = `https://docs.google.com/spreadsheets/d/${p.id}`;
  const strategies = [
    ["gviz JSONP", () => jsonpLoad(`${base}/gviz/tq?headers=0${g}`, true)],
    ["gviz CSV",   () => tryFetchCSV(`${base}/gviz/tq?tqx=out:csv&headers=0${g}`)],
    ["export CSV", () => tryFetchCSV(`${base}/export?format=csv${g}`)]
  ];
  const errs=[];
  for(const [name,fn] of strategies){
    try{
      const rows = await fn();
      const d = parseKQ(rows);
      const total = KQ_GROUPS.reduce((a,g)=>a+d.groups[g.key].length,0);
      /* sheet hợp lệ nếu nhận diện được cấu trúc (kể cả khi 4 nhóm đều 0 công tác) */
      if(total>0 || d.title){
        KQ = d;
        setKqStatus("");
        renderKQ(); return;
      }
      errs.push(`${name}: đọc được ${rows.length} dòng nhưng không nhận diện được các mục công tác`);
    }catch(e){ errs.push(`${name}: ${e.message}`); }
  }
  setKqStatus("Không đọc được Google Sheet. Chi tiết:\n"+errs.join("\n")+"\n\nHãy kiểm tra: (1) sheet đã chia sẻ \"Bất kỳ ai có đường liên kết – Người xem\"; (2) mở file HTML này bằng Chrome/Edge trực tiếp.", true);
}

renderKQ();
loadKQ();

/* ===== Nút: Tự động cuộn ===== */
(function(){
  /* Tự động cuộn kiểu marquee: chạy chậm, tới cuối thì nghỉ rồi quay về đầu và lặp lại liên tục cho đến khi bấm "Dừng cuộn" */
  const SPEED = 10;        /* px mỗi giây — chỉnh số này để nhanh/chậm */
  const HOLD  = 5000;      /* ms dừng ở cuối / đầu trang trước khi lặp */
  const btnAs = $("btnAutoScroll"), asTxt = $("btnAutoScrollText");
  let running = false, raf = 0, last = 0, pos = 0, holdUntil = 0, phase = "scroll";
  const getY = () => window.scrollY;
  const setY = y => window.scrollTo(0, y);
  const maxY = () => Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  function tick(t){
    if(!running) return;
    if(t < holdUntil){ last = t; raf = requestAnimationFrame(tick); return; }
    if(phase === "end"){            /* hết thời gian nghỉ ở cuối -> về đầu trang */
      pos = 0; setY(0); phase = "scroll"; holdUntil = t + HOLD; last = t;
      raf = requestAnimationFrame(tick); return;
    }
    const dt = Math.min(100, t - (last || t)); last = t;
    pos += SPEED * dt / 1000;
    if(pos >= maxY()){
      pos = maxY(); setY(pos);
      phase = "end"; holdUntil = t + HOLD;
    } else {
      setY(pos);
    }
    raf = requestAnimationFrame(tick);
  }
  function startAuto(){
    if(running) return;
    running = true; pos = getY(); last = 0; holdUntil = 0; phase = "scroll";
    asTxt.textContent = "Dừng chạy"; btnAs.firstChild.textContent = "⏸ ";
    raf = requestAnimationFrame(tick);
  }
  function stopAuto(){
    if(!running) return;
    running = false; cancelAnimationFrame(raf);
    asTxt.textContent = "Tự động chạy"; btnAs.firstChild.textContent = "▶ ";
  }
  btnAs.addEventListener("click", () => running ? stopAuto() : startAuto());
})();
</script>
