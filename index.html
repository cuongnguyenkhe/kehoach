<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kế hoạch kiểm tra TBA 110/220kV</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M36 4 12 36h15l-4 24 29-34H36z' fill='%23facc15'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#3a6ff7; --card:#ffffff; --text:#1f2937; --muted:#9aa3b5; --line:#e5e8f0;
    --thang:#f25a6b; --ngay:#fdac2f; --dem:#3a6ff7; --accent:#3a6ff7; --accent-ink:#ffffff;
    --head:#000000; --head2:#000000; --shadow:0 4px 14px rgba(40,60,120,.08);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:auto}
  body{margin:0;padding:24px;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#3569fb 0%,#4f7dfb 55%,#6f93fb 100%);background-color:#4f7dfb;color:var(--text);font-size:14px;line-height:1.45}

  /* ===== Header ===== */
  header{background:linear-gradient(135deg,#0f2a7a 0%,#1d4ed8 60%,#2f6bf0 100%);color:#fff;padding:22px 24px;max-width:1300px;margin:0 auto;border-radius:16px 16px 0 0;border-bottom:3px solid #facc15}
  .headwrap{max-width:1300px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
  .headwrap .unit{font-family:"Newsreader",Georgia,"Times New Roman",serif;margin:0 0 4px;font-size:24px;line-height:1.35;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#fff}
  header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.2px;color:var(--text)}
  header p{margin:4px 0 0;opacity:1;font-size:16px;font-weight:700;color:var(--text)}
  @media(max-width:700px){ header h1{font-size:22px} .headwrap .unit{font-size:18px} }

  #subtitle,#xlTitle{background:#fff;padding:14px 24px;border-bottom:1px solid var(--line);border-radius:8px}
  #subtitle:empty,#xlTitle:empty{display:none}

  /* ===== Control bar (sticky) ===== */
  .controlbar{position:static;background:#fff;width:100%;border-bottom:1px solid var(--line);border-radius:8px}
  .controlbar-inner{max-width:1300px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .field.grow{flex:1;min-width:260px}
  input,select,button{font-family:Arial,Helvetica,sans-serif;font-size:inherit;font-weight:inherit;line-height:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  input[type="date"]{color-scheme:light}
  input[type="date"]::-webkit-calendar-picker-indicator{
    cursor:pointer;opacity:1;filter:none;width:16px;height:16px;padding:0;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233a6ff7' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='5' width='18' height='16' rx='2'/><path d='M3 10h18M8 3v4M16 3v4'/></svg>") center/16px 16px no-repeat;
  }
  button{cursor:pointer;font-weight:600;transition:filter .15s}
  button:hover{filter:brightness(0.97)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.ghost{background:transparent}
  #status{font-size:12.5px;font-weight:400;text-transform:none;letter-spacing:normal;color:var(--muted)}
  #status.err{color:#dc2626;white-space:pre-line}

  main{max-width:1300px;margin:0 auto;padding:18px 24px 40px;display:flex;flex-direction:column;gap:26px;background:#f5f6fa;border-radius:0 0 16px 16px}

  /* ===== Section shell ===== */
  section.block{display:flex;flex-direction:column;gap:12px}
  .block-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .block-head h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .block-head .desc{color:var(--muted);font-size:12.5px;margin-left:2px}
  .block-head .spacer{flex:1}
  a.openlink{color:var(--accent);text-decoration:none;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
  a.openlink:hover{text-decoration:underline}

  /* ===== Result title / today badge ===== */
  .resultTitle{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .resultTitle .today{background:#ef4444;color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.3px}

  /* ===== Summary cards ===== */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .sbox{background:#ffffff;color:#1f2937;border:1px solid #eef0f6;border-radius:14px;border-top-width:4px;padding:16px;box-shadow:var(--shadow)}
  .sbox.thang{border-top-color:var(--thang)} .sbox.ngay{border-top-color:var(--ngay)} .sbox.dem{border-top-color:var(--dem)}
  .sbox h3{margin:0 0 10px;font-size:14.5px;font-weight:700;display:flex;justify-content:flex-start;align-items:center;gap:8px;color:#000000}
  .sbox.thang h3{color:var(--thang)} .sbox.ngay h3{color:var(--ngay)} .sbox.dem h3{color:var(--dem)}
  .sbox .cnt{font-size:inherit;font-weight:700;color:#dc2626}
  .team-line{margin:8px 0;line-height:1.6}
  .team-line b{color:#7c3aed;font-size:inherit;font-weight:700;display:block;margin-bottom:3px}
  .team-line b .tba-cnt{color:#dc2626}
  .tag{display:inline-block;background:#eef3ff;color:#1f2937;border:1px solid #d6e0ff;border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12.5px;font-weight:700}
  .empty{color:var(--muted);font-style:italic;font-size:13px}

  /* ===== Excel KHSX ===== */
  .xlbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .xlbar input[type=file]{flex:1;min-width:220px}
  .xlgrid{display:flex;flex-direction:column;gap:14px}
  .xlcol{display:flex;flex-direction:column;gap:14px;min-width:0}
  .doi{color:#7c3aed;font-weight:700}
  .xlgrp{font-size:inherit;font-weight:700;color:#7c3aed;margin:12px 0 4px}
  .xlgrp .tba-cnt{color:#dc2626}
  .wk{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .wk:last-child{border-bottom:0}
  .wk .loc{display:inline-block;background:#eef3ff;border:1px solid #d6e0ff;border-radius:6px;padding:1px 8px;margin-right:6px;font-weight:700}
  .wk .txt{white-space:pre-line;margin-top:3px}
  .wk .meta{color:var(--muted);font-size:12px;margin-top:3px}
  .wk .meta b{color:var(--text);font-weight:600}

  @media(max-width:700px){
    body{padding:10px}
    header{padding:16px}
    .controlbar-inner{padding:10px 16px}
    main{padding:14px 16px 30px}
  }
</style>
</head>
<body>
<header>
  <div class="headwrap">
    <div class="unit">Đội giám sát<br>Trung tâm giám sát &amp; vận hành lưới điện</div>
  </div>
</header>

<main>
  <section class="block">
    <div class="resultTitle" id="subtitle" style="justify-content:center;text-align:center"></div>
<div class="controlbar">
  <div class="controlbar-inner">
    <div class="field grow">
      <span>Dữ liệu từ Link Google Sheet: <a class="openlink" id="openLink" href="#" target="_blank" rel="noopener" style="text-transform:none;letter-spacing:normal;margin-left:6px">Mở trong tab mới ↗</a></span>
      <input type="url" id="urlInput" placeholder="https://docs.google.com/spreadsheets/d/…/edit?gid=…">
    </div>
    <div class="field" style="max-width:170px">
      CHỌN NGÀY
      <input type="date" id="dateInput">
    </div>
    <button class="primary" id="loadBtn">Tìm kiếm</button>
  </div>
</div>
    <div class="block-head">
      <h2 class="resultTitle" id="resultTitle"></h2>
      <span class="desc" id="status">Đang tải…</span>
    </div>
    <div class="summary" id="summary"></div>
  </section>

  <section class="block">
    <div class="resultTitle" id="xlTitle" style="justify-content:center;text-align:center"></div>
    <div class="xlbar">
      <input type="file" id="xlFile" accept=".xlsx,.xlsm,.xls">
      <select id="xlSheet" style="display:none"></select>
      <button class="ghost" id="xlClear" style="display:none">Xóa dữ liệu đã lưu</button>
      <span class="desc" id="xlStatus">Chưa chọn file.</span>
    </div>
    <div class="xlgrid" id="xlOut"></div>
  </section>

</main>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_URL = "https://docs.google.com/spreadsheets/d/1l1X8PcWLT0mXODl8CagJtGFLemQkuQq_/edit?gid=1786392608#gid=1786392608";
const KEY = { thang:"thang", ngay:"ngay", dem:"dem" };
const LABEL = { thang:"Kiểm tra THÁNG", ngay:"Kiểm tra NGÀY", dem:"Kiểm tra ĐÊM" };
const WD = ["CN","T2","T3","T4","T5","T6","T7"];

let DATA = { tba: [], month: 11, year: 2026 };
let DAYS = 31, FIRST_DAY_COL = 3;

const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").trim().toLowerCase();
const pad = n => String(n).padStart(2,"0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtVN = d => `${WD[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* escape + tô màu chữ "Đội ..." xuất hiện trong dữ liệu */
function hl(t){ return esc(t).replace(/(Đội(?:\s*QLVH)?(?:\s*\d+)?)/g,'<span class="doi">$1</span>'); }
function setStatus(t, err){ const s=$("status"); s.textContent=t||""; s.className = err?"err":""; }

function parseSheetUrl(u){
  const m = String(u).match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  if(!m) return null;
  const g = String(u).match(/[#?&]gid=(\d+)/);
  return { id:m[1], gid:g?g[1]:null };
}

function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=""; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* Tự nhận diện vị trí cột Đội / TBA / Tháng-Ngày-Đêm / các cột ngày */
function buildData(rows){
  const now=new Date(); let month=now.getMonth()+1, year=now.getFullYear();
  for(let i=0;i<Math.min(rows.length,12);i++){
    for(const c of rows[i]){
      const m = String(c??"").match(/(\d{1,2})\s*n[aă]m\s*(\d{4})/i);
      if(m){ month=+m[1]; year=+m[2]; }
    }
  }
  const cnt={};
  rows.forEach(r=>r.forEach((c,i)=>{ if(norm(c) in KEY) cnt[i]=(cnt[i]||0)+1; }));
  let labCol=-1, best=0;
  for(const k in cnt) if(cnt[k]>best){ best=cnt[k]; labCol=+k; }
  if(labCol<0) return { tba:[], month, year };
  const bCol=labCol-1, aCol=labCol-2;
  let firstCol=labCol+1, n=31;
  for(const r of rows.slice(0,40)){
    const cols=[]; r.forEach((c,i)=>{ if(i>labCol && /^\d{1,2}$/.test(String(c??"").trim())) cols.push(i); });
    if(cols.length>=25){ firstCol=cols[0]; n=Math.min(cols.length,31); break; }
  }
  DAYS=n; FIRST_DAY_COL=firstCol;
  const tba=[]; let team="", cur=null;
  for(const r of rows){
    const lab = norm(r[labCol]);
    if(!(lab in KEY)) continue;
    const a = aCol>=0 ? String(r[aCol]??"").trim() : "";
    const b = bCol>=0 ? String(r[bCol]??"").trim() : "";
    if(a && /\d/.test(a)) team = a;
    if(b){
      cur = { team, name:b, thang:Array(DAYS).fill(false), ngay:Array(DAYS).fill(false), dem:Array(DAYS).fill(false) };
      tba.push(cur);
    }
    if(!cur) continue;
    for(let i=0;i<DAYS;i++){
      cur[KEY[lab]][i] = String(r[FIRST_DAY_COL+i]??"").trim() !== "";
    }
  }
  return { tba, month, year };
}

async function tryFetchCSV(url){
  const res = await fetch(url, { cache:"no-store" });
  if(!res.ok) throw new Error("HTTP "+res.status);
  const t = await res.text();
  if(/^\s*<(!doctype|html)/i.test(t)) throw new Error("Google trả về trang đăng nhập (sheet chưa chia sẻ công khai?)");
  return parseCSV(t);
}

function jsonpLoad(url){
  return new Promise((resolve,reject)=>{
    const cb="__gv"+Date.now()+Math.floor(Math.random()*1e4);
    const s=document.createElement("script");
    const cleanup=()=>{ clearTimeout(t); delete window[cb]; s.remove(); };
    const t=setTimeout(()=>{ cleanup(); reject(new Error("quá thời gian chờ")); },20000);
    window[cb]=obj=>{
      cleanup();
      if(!obj || obj.status==="error"){
        const e=obj&&obj.errors&&obj.errors[0];
        reject(new Error((e&&(e.detailed_message||e.message))||"Google báo lỗi")); return;
      }
      resolve(obj.table.rows.map(r=>(r.c||[]).map(c=> c ? (c.v!=null ? String(c.v) : (c.f??"")) : "")));
    };
    s.onload=()=>{ if(window[cb]){ cleanup(); reject(new Error("Google trả về trang đăng nhập (sheet chưa chia sẻ công khai?)")); } };
    s.onerror=()=>{ cleanup(); reject(new Error("không kết nối được tới Google (mạng bị chặn?)")); };
    s.src=url+"&tqx=out:json;responseHandler:"+cb;
    document.head.appendChild(s);
  });
}

async function loadFromGoogle(){
  const p = parseSheetUrl($("urlInput").value.trim());
  if(!p){ setStatus("Link không hợp lệ. Hãy dán link Google Sheet dạng https://docs.google.com/spreadsheets/d/…", true); return; }
  try{ localStorage.setItem("tba_filter_url", $("urlInput").value.trim()); }catch(e){}

  /* Link mở bảng gốc đúng tab theo gid */
  const editUrl = `https://docs.google.com/spreadsheets/d/${p.id}/edit${p.gid?("?gid="+p.gid):""}`;
  $("openLink").href = editUrl;

  setStatus("Đang tải từ Google Sheet…");
  const g = p.gid ? `&gid=${p.gid}` : "";
  const base = `https://docs.google.com/spreadsheets/d/${p.id}`;
  const strategies = [
    ["gviz JSONP",  () => jsonpLoad(`${base}/gviz/tq?headers=0${g}`)],
    ["gviz CSV",    () => tryFetchCSV(`${base}/gviz/tq?tqx=out:csv&headers=0${g}`)],
    ["export CSV",  () => tryFetchCSV(`${base}/export?format=csv${g}`)]
  ];
  const errs=[];
  for(const [name,fn] of strategies){
    try{
      const rows = await fn();
      const d = buildData(rows);
      if(d.tba.length){ DATA = d; setStatus(`Cập nhật mới nhất lúc: ${new Date().toLocaleTimeString("vi-VN")} ngày ${new Date().toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"})}`); render(); return; }
      errs.push(`${name}: đọc được ${rows.length} dòng nhưng không thấy dòng Tháng/Ngày/Đêm`);
    }catch(e){ errs.push(`${name}: ${e.message}`); }
  }
  setStatus("Không đọc được Google Sheet. Chi tiết:\n"+errs.join("\n")+"\n\nHãy kiểm tra: (1) sheet đã chia sẻ \"Bất kỳ ai có đường liên kết – Người xem\"; (2) mở file HTML này bằng Chrome/Edge trực tiếp (không xem trước trong ứng dụng).", true);
}

function selectedDate(){
  const v = $("dateInput").value; if(!v) return null;
  const [y,m,d] = v.split("-").map(Number);
  return new Date(y,m-1,d);
}
function selectedIndex(){
  const sel = selectedDate(); if(!sel) return -1;
  const first = new Date(DATA.year, DATA.month-1, 1);
  const idx = Math.round((sel-first)/864e5);
  return (idx>=0 && idx<DAYS) ? idx : -1;
}

function render(){
  const idx = selectedIndex();
  const d = selectedDate();
  const isToday = d && toISO(d)===toISO(new Date());
  $("subtitle").innerHTML = `KẾ HOẠCH VẬN HÀNH LƯỚI ĐIỆN THÁNG ${DATA.month}/${DATA.year}: <span style="color:#ff3b3b">${DATA.tba.length} TBA</span>`;

  const fmtNgay = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  $("resultTitle").innerHTML = d
    ? `🔎 Kế hoạch kiểm tra TBA 110/220kV ngày: ${fmtNgay(d)} ${isToday?'<span class="today">HÔM NAY</span>':''}`
    : "🔎 Chọn một ngày để lọc";

  const sum = { thang:{}, ngay:{}, dem:{} };
  if(idx>=0){
    for(const t of DATA.tba){
      for(const k of ["thang","ngay","dem"]){
        if(t[k][idx]) (sum[k][t.team] ??= []).push(t.name);
      }
    }
  }
  const count = k => Object.values(sum[k]).reduce((a,b)=>a+b.length,0);

  const sm = $("summary"); sm.innerHTML="";
  for(const k of ["thang","ngay","dem"]){
    const box=document.createElement("div"); box.className="sbox "+k;
    let body="";
    if(idx<0){
      body = `<div class="empty">Ngày đã chọn nằm ngoài phạm vi kế hoạch trong sheet, hoặc chưa chọn ngày.</div>`;
    } else {
      const teams=Object.keys(sum[k]).sort((a,b)=>a.localeCompare(b,"vi",{numeric:true}));
      body = teams.length
        ? teams.map(tm=>`<div class="team-line"><b>Đội ${tm}: <span class="tba-cnt">${sum[k][tm].length} TBA</span></b>${sum[k][tm].map(n=>`<span class="tag">${esc(n)}</span>`).join("")}</div>`).join("")
        : `<div class="empty">Không có TBA nào.</div>`;
    }
    box.innerHTML = `<h3>${LABEL[k]}:<span class="cnt">${idx<0?"–":count(k)} TBA</span></h3>${body}`;
    sm.appendChild(box);
  }
}

/* ===== Excel KHSX: Đội → Phần trạm/Đường dây → Công tác trong ngày / dài ngày ===== */
const XL_CARDS = [
  { grp:"dai",   part:"tba", cls:"thang", title:"Công tác dài ngày – TBA" },
  { grp:"dai",   part:"dz",  cls:"thang", title:"Công tác dài ngày – Đường dây" },
  { grp:"trong", part:"tba", cls:"ngay",  title:"Công tác trong ngày – TBA" },
  { grp:"trong", part:"dz",  cls:"ngay",  title:"Công tác trong ngày – Đường dây" }
];
let XL_ITEMS = [], XL_TITLE = "";

function parseKH(rows){
  const s = v => String(v ?? "").replace(/\s+/g," ").trim();
  const multi = v => String(v ?? "").replace(/[ \t]+/g," ").replace(/\n\s*/g,"\n").trim();
  let title="", team=null, part=null, grp=null; const items=[];
  for(const r of rows){
    const a=s(r[0]), b=s(r[1]), nb=norm(b);
    if(!title && a.length>10) title=a;
    const mt = nb.match(/^doi\s*qlvh\s*(\d+)/);
    if(mt){ team=mt[1]; part=null; grp=null; continue; }
    if((a==="A"||a==="B") && nb.startsWith("phan")){
      part = nb.includes("tram") ? "tba" : (nb.includes("duong day") ? "dz" : null); grp=null; continue;
    }
    if(/^\d+$/.test(a) && b){
      grp = nb.startsWith("cong tac trong ngay") ? "trong" : nb.startsWith("cong tac dai ngay") ? "dai" : "other"; continue;
    }
    if(team && part && (grp==="trong"||grp==="dai") && /^\d+\.\d+$/.test(a)){
      const it = { team, part, grp, date:b, loc:s(r[2]), text:multi(r[3]), who:s(r[4]), unit:s(r[5]), time:s(r[6]), note:s(r[9]) };
      if(it.loc||it.text||it.unit||it.time) items.push(it);
    }
  }
  return { title, items };
}

function xlRender(){
  $("xlTitle").textContent = XL_TITLE || "";
  const out=$("xlOut"); out.innerHTML="";
  const cols={ dai:document.createElement("div"), trong:document.createElement("div") };
  for(const k in cols){ cols[k].className="xlcol"; out.appendChild(cols[k]); }
  for(const c of XL_CARDS){
    const list = XL_ITEMS.filter(i=>i.grp===c.grp && i.part===c.part);
    const teams = [...new Set(list.map(i=>i.team))].sort((x,y)=>x-y);
    const box=document.createElement("div"); box.className="sbox "+c.cls;
    box.innerHTML = `<h3>${c.title}:<span class="cnt">${list.length} công tác</span></h3>` + (teams.length
      ? teams.map(t=>{
          const L=list.filter(i=>i.team===t);
          return `<div class="xlgrp">Đội ${t}: <span class="tba-cnt">${L.length} công tác</span></div>` + L.map(i=>`
            <div class="wk">
              ${i.loc?`<span class="loc">${hl(i.loc)}</span>`:""}${i.date?`<span class="tag">${esc(i.date)}</span>`:""}
              <div class="txt">${hl(i.text||"(không có nội dung)")}</div>
              <div class="meta">${[i.unit&&`<b>ĐVTC:</b> ${hl(i.unit)}`, i.who&&`<b>Người TH:</b> ${hl(i.who)}`, i.time&&`<b>Thời gian:</b> ${esc(i.time)}`, i.note&&`<b>Ghi chú:</b> ${hl(i.note)}`].filter(Boolean).join(" · ")}</div>
            </div>`).join("");
        }).join("")
      : `<div class="empty">Không có công tác.</div>`);
    cols[c.grp].appendChild(box);
  }
}

const XL_KEY = "tba_xl_data";
let XL_STORE = null; // { file, savedAt, current, sheets:{ name:{title,items} } }

function xlSave(){ try{ localStorage.setItem(XL_KEY, JSON.stringify(XL_STORE)); }catch(e){ $("xlStatus").textContent += " (Không lưu được vào trình duyệt)"; } }

/* Tiêu đề sheet KQ chỉ có "NGÀY 23/11" → bổ sung năm (lấy từ tên sheet, vd "KQ 23.11.26") */
function withYear(t, name){
  if(!t || /\d{1,2}\/\d{1,2}\/\d{4}/.test(t)) return t;
  const m = t.match(/(\d{1,2})\/(\d{1,2})(?![\/\d])/); if(!m) return t;
  const yy = (String(name).match(/\.(\d{2})\s*$/)||[])[1];
  const y = yy ? 2000 + (+yy) : (DATA.year || new Date().getFullYear());
  return t.replace(m[0], m[0] + "/" + y);
}

function xlShowSheet(name){
  const r = XL_STORE.sheets[name]; if(!r) return;
  XL_STORE.current = name; XL_ITEMS = r.items; XL_TITLE = withYear(r.title, name);
  $("xlStatus").style.color="";
  $("xlStatus").textContent = r.items.length ? "" : "Không đọc được công tác nào trong sheet này. Hãy chọn sheet khác ở ô bên cạnh.";
  $("xlSheet").value = name;
  xlRender(); xlSave();
}

function xlFillSelect(){
  const sel=$("xlSheet"); sel.innerHTML="";
  const rank = n => /^kq\b/i.test(n.trim()) ? 0 : /^kh\b/i.test(n.trim()) ? 1 : 2;
  const names = Object.keys(XL_STORE.sheets).sort((a,b)=>rank(a)-rank(b));
  names.forEach(n=>{ const o=document.createElement("option"); o.value=n; o.textContent=n.trim(); sel.appendChild(o); });
  sel.style.display = names.length>1 ? "" : "none";
  $("xlClear").style.display = "";
}

function loadScript(src){
  return new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>no(new Error(src)); document.head.appendChild(s); });
}
async function ensureXLSX(){
  if(window.XLSX) return;
  for(const u of ["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"]){
    try{ await loadScript(u); if(window.XLSX) return; }catch(e){}
  }
  throw new Error("không tải được thư viện đọc Excel (mạng có thể chặn cdnjs/jsdelivr)");
}

$("xlFile").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  /* Xóa dữ liệu Excel cũ (cả bản đã lưu) trước khi nạp file mới */
  try{ localStorage.removeItem(XL_KEY); }catch(_){}
  XL_STORE=null; XL_ITEMS=[]; XL_TITLE=""; xlRender();
  $("xlSheet").style.display="none"; $("xlClear").style.display="none";
  $("xlStatus").textContent = "Đang đọc file…"; $("xlStatus").style.color="";
  try{
    await ensureXLSX();
    const wb = XLSX.read(await f.arrayBuffer(), { type:"array" });
    const sheets = {};
    wb.SheetNames.forEach(n=>{
      sheets[n] = parseKH(XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, defval:"", raw:false }));
    });
    const names = Object.keys(sheets);
    const kh = names.find(n=>/^kq\b/i.test(n.trim())) || names.find(n=>/^kh\b/i.test(n.trim())) || names.find(n=>sheets[n].items.length) || names[0];
    XL_STORE = { file:f.name, savedAt:Date.now(), current:kh, sheets };
    xlFillSelect(); xlShowSheet(kh);
    e.target.value = "";
  }catch(err){ $("xlStatus").textContent = "Lỗi: " + err.message; $("xlStatus").style.color="#dc2626"; }
};
$("xlSheet").onchange = e => xlShowSheet(e.target.value);
$("xlClear").onclick = () => {
  if(!confirm("Xóa dữ liệu Excel đã lưu trên trình duyệt này?")) return;
  try{ localStorage.removeItem(XL_KEY); }catch(e){}
  XL_STORE=null; XL_ITEMS=[]; XL_TITLE=""; $("xlFile").value=""; $("xlSheet").style.display="none"; $("xlClear").style.display="none";
  $("xlStatus").textContent="Chưa chọn file."; xlRender();
};
/* Khôi phục dữ liệu Excel đã lưu khi mở lại trang */
try{
  const raw = localStorage.getItem(XL_KEY);
  if(raw){ const d = JSON.parse(raw); if(d && d.sheets && d.sheets[d.current]){ XL_STORE=d; xlFillSelect(); xlShowSheet(d.current); } }
}catch(e){}
if(!XL_STORE) xlRender();

let saved=""; try{ saved = localStorage.getItem("tba_filter_url") || ""; }catch(e){}
$("urlInput").value = saved || DEFAULT_URL;
$("dateInput").value = toISO(new Date());
$("dateInput").onchange = render;
$("loadBtn").onclick = loadFromGoogle;
$("urlInput").addEventListener("keydown", e => { if(e.key==="Enter") loadFromGoogle(); });

loadFromGoogle();
</script>
